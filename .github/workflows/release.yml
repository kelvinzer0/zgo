name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build & Release ZGo
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          OUT_NAME="zgo-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.Version=${{ github.ref_name }} -X main.GitCommit=${{ github.sha }} -X main.BuildDate=$(date -u +%Y-%m-%d)" -o "dist/$OUT_NAME" ./cmd/zgo

      - name: Attest Provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/*'

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zgo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
